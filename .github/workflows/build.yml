name: build
on:
  push:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin, arch: arm64, executable: RPG Harness, binary: RPG Harness.app/Contents/MacOS/RPG Harness, app: RPG Harness.app/Contents/Resources/app }
          - { os: macos-15-intel, platform: darwin, arch: x64, executable: RPG Harness, binary: RPG Harness.app/Contents/MacOS/RPG Harness, app: RPG Harness.app/Contents/Resources/app }
          - { os: windows-latest, platform: win32, arch: x64, executable: RPG Harness, binary: RPG Harness.exe, app: resources/app }
          - { os: windows-11-arm, platform: win32, arch: arm64, executable: RPG Harness, binary: RPG Harness.exe, app: resources/app }
          - { os: ubuntu-latest, platform: linux, arch: x64, executable: rpg-harness, binary: rpg-harness, app: resources/app, launcher: xvfb-run -a, flags: --no-sandbox }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, executable: rpg-harness, binary: rpg-harness, app: resources/app, launcher: xvfb-run -a, flags: --no-sandbox }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_DIR: out/RPG Harness-${{ matrix.platform }}-${{ matrix.arch }}
      ARCHIVE: rpg-harness-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm install --frozen-lockfile --prod --config.node-linker=hoisted --ignore-scripts
      - run: pnpm --config.verify-deps-before-run=false package:desktop --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --executable-name="${{ matrix.executable }}"
      - run: tar -czf "$ARCHIVE" -C out "$(basename "$PACKAGE_DIR")"
      - name: install from archive
        run: |
          mkdir installed
          tar -xzf "$ARCHIVE" -C installed
          echo "INSTALLED=$PWD/installed/$(basename "$PACKAGE_DIR")" >> "$GITHUB_ENV"
      - name: desktop smoke
        timeout-minutes: 5
        env:
          RPG_DESKTOP_SMOKE: 1
        run: |
          RPG_DATA_DIR="$RUNNER_TEMP/desktop-data" ${{ matrix.launcher }} "$INSTALLED/${{ matrix.binary }}" ${{ matrix.flags }} | tee smoke.log
          grep -q "rpg-desktop-smoke-status: Connected" smoke.log
      - name: cli smoke without a provider
        timeout-minutes: 2
        env:
          ELECTRON_RUN_AS_NODE: 1
          RPG_DATA_DIR: ${{ runner.temp }}/cli-data
        run: |
          rpg() { "$INSTALLED/${{ matrix.binary }}" "$INSTALLED/${{ matrix.app }}/apps/cli/src/bin.ts" "$@"; }
          rpg new Smoke | tee new.log
          grep -q "no AI game master is available" new.log
          rpg list | tee list.log
          grep -q "Campaigns: Smoke" list.log
      - uses: actions/upload-artifact@v7
        with:
          name: rpg-harness-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes *.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
